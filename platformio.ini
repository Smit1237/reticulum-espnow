[platformio]
default_envs = client_c3

; ============================================================
; Shared base configuration
; ============================================================
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_unflags =
    -fno-exceptions
    -std=gnu++11

build_flags =
    -std=gnu++17
    -fexceptions
    -I include
    -Wall
    -Wno-missing-field-initializers
    -Wno-format
    -Wno-unused-parameter
    -DMCU_ESP32
    -DRNS_USE_FS
    -DRNS_PERSIST_PATHS
    -DUSTORE_USE_LITTLEFS
    -DMSGPACK_USE_BOOST=OFF

lib_deps =
    https://github.com/attermann/microReticulum.git
    ArduinoJson@^7.4.2
    MsgPack@^0.4.2
    https://github.com/attermann/Crypto.git
    https://github.com/attermann/microStore.git

monitor_filters = esp32_exception_decoder

; ============================================================
; Display library sections (included per-env as needed)
; ============================================================
[ssd1306_display]
lib_deps = olikraus/U8g2@^2.35.19

[tft_display]
lib_deps = bodmer/TFT_eSPI@^2.5.0

; ============================================================
; Role base sections
; ============================================================
[client_base]
build_src_filter = +<main_client.cpp>
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2.2.3

[retranslator_base]
build_src_filter = +<main_retranslator.cpp>

; ============================================================
; ESP32-C3 — RISC-V, BLE 5.0, SSD1306 OLED, no PSRAM
; ============================================================
[env:client_c3]
extends = env
board = esp32-c3-devkitm-1
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps =
    ${client_base.lib_deps}
    ${ssd1306_display.lib_deps}

[env:retranslator_c3]
extends = env
board = esp32-c3-devkitm-1
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps =
    ${env.lib_deps}
    ${ssd1306_display.lib_deps}

; ============================================================
; LilyGO T-Display — ESP32 classic, ST7789 TFT 135x240
; ============================================================
[tdisplay_tft_flags]
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000

[env:client_tdisplay]
extends = env
board = lilygo-t-display
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    ${tdisplay_tft_flags.build_flags}
    -DBOARD_TDISPLAY
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps =
    ${client_base.lib_deps}
    ${tft_display.lib_deps}

[env:retranslator_tdisplay]
extends = env
board = lilygo-t-display
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    ${tdisplay_tft_flags.build_flags}
    -DBOARD_TDISPLAY
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps =
    ${env.lib_deps}
    ${tft_display.lib_deps}

; ============================================================
; ESP32-S3 — Xtensa dual-core, BLE 5.0, PSRAM, no display
; ============================================================
[env:client_s3]
extends = env
board = esp32-s3-devkitc-1
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_PSRAM_ALLOCATOR
lib_deps = ${client_base.lib_deps}

[env:retranslator_s3]
extends = env
board = esp32-s3-devkitc-1
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_PSRAM_ALLOCATOR

; ============================================================
; ESP32 classic — Xtensa dual-core, BLE 4.2, no display
; ============================================================
[env:client_esp32]
extends = env
board = esp32dev
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps = ${client_base.lib_deps}

[env:retranslator_esp32]
extends = env
board = esp32dev
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR

; ============================================================
; ESP32-C6 — RISC-V, BLE 5.0, WiFi 6, no display
; ============================================================
[env:client_c6]
extends = env
board = esp32-c6-devkitc-1
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C6
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps = ${client_base.lib_deps}

[env:retranslator_c6]
extends = env
board = esp32-c6-devkitc-1
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C6
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR

; ============================================================
; ESP32-S2 — Xtensa single-core, NO BLE, retranslator only
; ============================================================
[env:retranslator_s2]
extends = env
board = esp32-s2-saola-1
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
