[platformio]
default_envs = client_c3

; ============================================================
; Shared base configuration
; ============================================================
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_unflags =
    -fno-exceptions
    -std=gnu++11

build_flags =
    -std=gnu++17
    -fexceptions
    -Wall
    -Wno-missing-field-initializers
    -Wno-format
    -Wno-unused-parameter
    -DMCU_ESP32
    -DRNS_USE_FS
    -DRNS_PERSIST_PATHS
    -DUSTORE_USE_LITTLEFS
    -DMSGPACK_USE_BOOST=OFF

lib_deps =
    https://github.com/attermann/microReticulum.git
    ArduinoJson@^7.4.2
    MsgPack@^0.4.2
    https://github.com/attermann/Crypto.git
    https://github.com/attermann/microStore.git
    olikraus/U8g2@^2.35.19

monitor_filters = esp32_exception_decoder

; Shared client base (adds NimBLE + KISS bridge)
[client_base]
build_src_filter = +<main_client.cpp>
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2.2.3

; Shared retranslator base (no NimBLE needed)
[retranslator_base]
build_src_filter = +<main_retranslator.cpp>

; ============================================================
; ESP32-C3 — RISC-V, BLE 5.0, no PSRAM, USB CDC
; ============================================================
[env:client_c3]
extends = env
board = esp32-c3-devkitm-1
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps = ${client_base.lib_deps}

[env:retranslator_c3]
extends = env
board = esp32-c3-devkitm-1
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR

; ============================================================
; ESP32-S3 — Xtensa dual-core, BLE 5.0, PSRAM, USB CDC
; ============================================================
[env:client_s3]
extends = env
board = esp32-s3-devkitc-1
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_PSRAM_ALLOCATOR
lib_deps = ${client_base.lib_deps}

[env:retranslator_s3]
extends = env
board = esp32-s3-devkitc-1
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_PSRAM_ALLOCATOR

; ============================================================
; ESP32 classic — Xtensa dual-core, BLE 4.2, optional PSRAM, no USB CDC
; ============================================================
[env:client_esp32]
extends = env
board = esp32dev
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps = ${client_base.lib_deps}

[env:retranslator_esp32]
extends = env
board = esp32dev
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR

; ============================================================
; ESP32-C6 — RISC-V, BLE 5.0, WiFi 6, no PSRAM, USB CDC
; ============================================================
[env:client_c6]
extends = env
board = esp32-c6-devkitc-1
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C6
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps = ${client_base.lib_deps}

[env:retranslator_c6]
extends = env
board = esp32-c6-devkitc-1
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C6
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR

; ============================================================
; ESP32-S2 — Xtensa single-core, NO BLE, retranslator only
; ============================================================
[env:retranslator_s2]
extends = env
board = esp32-s2-saola-1
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
