board = esp32-c6-devkitc-1
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C6
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR

; ============================================================
; ESP32-S2 — Xtensa single-core, NO BLE, retranslator only
; ============================================================
[env:retranslator_s2]
extends = env
board = esp32-s2-saola-1
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR

; ============================================================
; UART Client — RNode KISS bridge over USB serial (no BLE)
; ============================================================
[env:uart_c3]
extends = env
board = esp32-c3-devkitm-1
build_src_filter = ${uart_client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps =
    ${env.lib_deps}
    ${ssd1306_display.lib_deps}

[env:uart_tdisplay]
extends = env
board = lilygo-t-display
build_src_filter = ${uart_client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    ${tdisplay_tft_flags.build_flags}
    -DBOARD_TDISPLAY
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps =
    ${env.lib_deps}
    ${tft_display.lib_deps}

[env:uart_s3]
extends = env
board = esp32-s3-devkitc-1
build_src_filter = ${uart_client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR

[env:uart_esp32]
extends = env
board = esp32dev
build_src_filter = ${uart_client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR

[env:uart_c6]
extends = env
board = esp32-c6-devkitc-1
build_src_filter = ${uart_client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C6
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR

[env:uart_s2]
extends = env
board = esp32-s2-saola-1
build_src_filter = ${uart_client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S2
