[platformio]
default_envs = client_c3

; ============================================================
; Shared base configuration
; ============================================================
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_unflags =
    -fno-exceptions
    -std=gnu++11

extra_scripts = pre:extra_script.py

build_flags =
    -std=gnu++17
    -fexceptions
    -I include
    -Wall
    -Wno-missing-field-initializers
    -Wno-format
    -Wno-unused-parameter
    ; --- Suppress warnings from third-party libraries (valid for both C and C++) ---
    -Wno-switch                  ; microReticulum: unhandled enum values in switch
    -Wno-unused-variable         ; microReticulum: unused vars in Transport/Link
    -Wno-unused-but-set-variable ; microReticulum: set-but-unused vars
    -Wno-parentheses             ; microReticulum: operator precedence in Link.cpp
    -Wno-unused-result           ; microReticulum: nodiscard string ops in Packet.cpp
    -Wno-cpp                     ; DebugLog: default log level #warning
    -DMCU_ESP32
    -DRNS_USE_FS
    -DRNS_PERSIST_PATHS
    -DUSTORE_USE_LITTLEFS
    -DMSGPACK_USE_BOOST=OFF
    ; Debug logging controlled per-env, not globally

lib_deps =
    https://github.com/attermann/microReticulum.git
    ArduinoJson@^7.4.2
    MsgPack@^0.4.2
    https://github.com/attermann/Crypto.git
    https://github.com/attermann/microStore.git

monitor_filters = esp32_exception_decoder

; ============================================================
; Display library sections (included per-env as needed)
; ============================================================
[ssd1306_display]
lib_deps = olikraus/U8g2@^2.35.19

[tft_display]
lib_deps = bodmer/TFT_eSPI@^2.5.0

; ============================================================
; Role base sections
; ============================================================
[client_base]
build_src_filter = +<main_client.cpp>
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2.2.3

[uart_client_base]
build_src_filter = +<main_uart_client.cpp>

[retranslator_base]
build_src_filter = +<main_retranslator.cpp>

; ============================================================
; ESP32-C3 — RISC-V, BLE 5.0, SSD1306 OLED, no PSRAM
; ============================================================
[env:client_c3]
extends = env
board = esp32-c3-devkitm-1
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps =
    ${client_base.lib_deps}
    ${ssd1306_display.lib_deps}

[env:retranslator_c3]
extends = env
board = esp32-c3-devkitm-1
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps =
    ${env.lib_deps}
    ${ssd1306_display.lib_deps}

[env:retranslator_c3_debug]
extends = env:retranslator_c3
build_flags =
    ${env:retranslator_c3.build_flags}
    -DDEBUG_BUILD

; ============================================================
; LilyGO T-Display — ESP32 classic, ST7789 TFT 135x240
; ============================================================
[tdisplay_tft_flags]
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000

[env:client_tdisplay]
extends = env
board = lilygo-t-display
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    ${tdisplay_tft_flags.build_flags}
    -DBOARD_TDISPLAY
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps =
    ${client_base.lib_deps}
    ${tft_display.lib_deps}

[env:retranslator_tdisplay]
extends = env
board = lilygo-t-display
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    ${tdisplay_tft_flags.build_flags}
    -DBOARD_TDISPLAY
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps =
    ${env.lib_deps}
    ${tft_display.lib_deps}

; ============================================================
; ESP32-S3 — Xtensa dual-core, BLE 5.0, PSRAM, no display
; ============================================================
; --- S3 shared base configs for PSRAM variants ---
[s3_base]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDUAL_SERIAL=1

[s3_no_psram]
build_flags = -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR

[s3_r8]
; 8MB octal PSRAM (N16R8, N8R8)
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags = -DBOARD_HAS_PSRAM=1 -DRNS_DEFAULT_ALLOCATOR=RNS_PSRAM_ALLOCATOR -DUSTORE_MAX_VALUE_LEN=2048

[s3_r2]
; 2MB quad PSRAM (N4R2, N8R2, N16R2)
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
build_flags = -DBOARD_HAS_PSRAM=1 -DRNS_DEFAULT_ALLOCATOR=RNS_PSRAM_ALLOCATOR -DUSTORE_MAX_VALUE_LEN=2048

; --- S3 client: no PSRAM needed (BLE bridge doesn't store paths) ---
[env:client_s3]
extends = env
board = ${s3_base.board}
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${s3_base.build_flags}
    ${s3_no_psram.build_flags}
lib_deps = ${client_base.lib_deps}

; --- S3 retranslator: 8MB octal PSRAM (N16R8, N8R8) ---
[env:retranslator_s3_r8]
extends = env
board = ${s3_base.board}
build_src_filter = ${retranslator_base.build_src_filter}
board_build.partitions = partitions_s3.csv
board_build.arduino.memory_type = ${s3_r8.board_build.arduino.memory_type}
board_build.psram_type = ${s3_r8.board_build.psram_type}
build_flags =
    ${s3_base.build_flags}
    ${s3_r8.build_flags}

; --- S3 retranslator: 2MB quad PSRAM (N4R2, N8R2, N16R2) ---
[env:retranslator_s3_r2]
extends = env
board = ${s3_base.board}
build_src_filter = ${retranslator_base.build_src_filter}
board_build.arduino.memory_type = ${s3_r2.board_build.arduino.memory_type}
board_build.psram_type = ${s3_r2.board_build.psram_type}
build_flags =
    ${s3_base.build_flags}
    ${s3_r2.build_flags}

; --- S3 retranslator: no PSRAM (N4, N8, N16 without R) ---
[env:retranslator_s3]
extends = env
board = ${s3_base.board}
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${s3_base.build_flags}
    ${s3_no_psram.build_flags}

; ============================================================
; ESP32 classic — Xtensa dual-core, BLE 4.2, no display
; ============================================================
[env:client_esp32]
extends = env
board = esp32dev
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps = ${client_base.lib_deps}

[env:retranslator_esp32]
extends = env
board = esp32dev
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR

[env:retranslator_esp32_debug]
extends = env:retranslator_esp32
build_flags =
    ${env:retranslator_esp32.build_flags}
    -DDEBUG_BUILD

; ESP32-WROVER with 4MB quad PSRAM
[env:retranslator_wrover]
extends = env
board = esp-wrover-kit
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32
    -DBOARD_HAS_PSRAM=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_PSRAM_ALLOCATOR
    -DUSTORE_MAX_VALUE_LEN=2048

[env:retranslator_wrover_debug]
extends = env:retranslator_wrover
build_flags =
    ${env:retranslator_wrover.build_flags}
    -DDEBUG_BUILD

; ESP32-CAM (AI-Thinker) with 4MB PSRAM — camera not used, PSRAM free for paths
[env:client_espcam]
extends = env
board = esp32cam
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
lib_deps = ${client_base.lib_deps}

[env:retranslator_espcam]
extends = env
board = esp32cam
build_src_filter = ${retranslator_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32
    -DBOARD_HAS_PSRAM=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_PSRAM_ALLOCATOR
    -DUSTORE_MAX_VALUE_LEN=2048

[env:retranslator_espcam_debug]
extends = env:retranslator_espcam
build_flags =
    ${env:retranslator_espcam.build_flags}
    -DDEBUG_BUILD

; ============================================================
; ESP32-C6 — RISC-V, BLE 5.0, WiFi 6, no display
; ============================================================
[env:client_c6]
extends = env
board = esp32-c6-devkitc-1
build_src_filter = ${client_base.build_src_filter}
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C6
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR
