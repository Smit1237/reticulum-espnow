[platformio]
default_envs = client

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

upload_port = COM21
monitor_port = COM21
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_unflags =
    -fno-exceptions
    -std=gnu++11

build_flags =
    -std=gnu++17
    -fexceptions
    -Wall
    -Wno-missing-field-initializers
    -Wno-format
    -Wno-unused-parameter
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DMCU_ESP32
    -DRNS_USE_FS
    -DRNS_PERSIST_PATHS
    -DUSTORE_USE_LITTLEFS
    -DMSGPACK_USE_BOOST=OFF
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR

lib_deps =
    https://github.com/attermann/microReticulum.git
    ArduinoJson@^7.4.2
    MsgPack@^0.4.2
    https://github.com/attermann/Crypto.git
    https://github.com/attermann/microStore.git
    olikraus/U8g2@^2.35.19
    h2zero/NimBLE-Arduino@^2.2.3

monitor_filters = esp32_exception_decoder

; --- Client: RNode-compatible BLE-to-ESP-NOW bridge ---
[env:client]
build_src_filter = +<main_client.cpp>

; --- Retranslator: pure Reticulum transport node ---
[env:retranslator]
build_src_filter = +<main_retranslator.cpp>
; Retranslator doesn't need NimBLE — override lib_deps without it
lib_deps =
    https://github.com/attermann/microReticulum.git
    ArduinoJson@^7.4.2
    MsgPack@^0.4.2
    https://github.com/attermann/Crypto.git
    https://github.com/attermann/microStore.git
    olikraus/U8g2@^2.35.19
