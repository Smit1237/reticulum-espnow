name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build firmware (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: riscv
            envs: >-
              client_c3
              retranslator_c3
              retranslator_c3_debug
              client_c6
              retranslator_c6
              uart_c3
              uart_c6
          - group: xtensa-s3
            envs: >-
              client_s3
              retranslator_s3
              retranslator_s3_r2
              retranslator_s3_r8
              uart_s3
          - group: xtensa-esp32
            envs: >-
              client_esp32
              retranslator_esp32
              retranslator_esp32_debug
              retranslator_wrover
              retranslator_wrover_debug
              client_espcam
              retranslator_espcam
              retranslator_espcam_debug
              uart_esp32
          - group: xtensa-other
            envs: >-
              client_tdisplay
              retranslator_tdisplay
              uart_tdisplay
              retranslator_s2
              uart_s2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/
          key: ${{ runner.os }}-pio-${{ matrix.group }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.group }}-
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build environments
        env:
          FIRMWARE_VERSION: ${{ github.ref_name }}
        run: |
          for env in ${{ matrix.envs }}; do
            echo "Building $env..."
            pio run -e "$env"
          done

      - name: Collect binaries
        run: |
          mkdir -p artifacts
          find .pio/build -name "firmware_*.bin" ! -name "*.app.bin" -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.group }}
          path: artifacts/
          retention-days: 3

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          pattern: firmware-*
          merge-multiple: true

      - name: List binaries
        run: ls -la firmware/

      - name: Generate SHA256 checksums
        run: |
          cd firmware
          sha256sum *.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/*.bin
            firmware/SHA256SUMS.txt
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}

  deploy:
    name: Deploy to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source (for flasher)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: firmware-*
          merge-multiple: true

      - name: Deploy firmware and update manifest
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd gh-pages

          # Create version directory and copy binaries
          mkdir -p "firmware/${VERSION}"
          cp ../artifacts/*.bin "firmware/${VERSION}/"

          # Generate SHA256 checksums
          cd "firmware/${VERSION}"
          sha256sum *.bin > SHA256SUMS.txt
          cd ../..

          # Copy latest flasher from source (flasher/ version has ../docs path)
          cp ../source/flasher/index.html flasher/index.html

          # Root index.html: same flasher but fix docs link for root path
          cp flasher/index.html index.html
          sed -i 's|../docs/manual.html|docs/manual.html|g' index.html

          # Copy HTML manual from source
          mkdir -p docs
          cp ../source/docs/manual.html docs/manual.html

          # Generate versions.json by scanning firmware directories
          python3 - << 'PYEOF'
          import json, os, glob
          from datetime import datetime

          versions = []
          firmware_dir = "firmware"
          for d in sorted(glob.glob(os.path.join(firmware_dir, "v*")), reverse=True):
              ver = os.path.basename(d)
              bins = sorted([os.path.basename(f) for f in glob.glob(os.path.join(d, "*.bin"))])
              if not bins:
                  continue
              # Use directory mtime as date
              mtime = os.path.getmtime(d)
              date_str = datetime.fromtimestamp(mtime).strftime("%Y-%m-%d")
              versions.append({"version": ver, "date": date_str, "files": bins})

          manifest = {"latest": versions[0]["version"] if versions else "", "versions": versions}

          with open(os.path.join(firmware_dir, "versions.json"), "w") as f:
              json.dump(manifest, f, indent=2)

          print(json.dumps(manifest, indent=2))
          PYEOF

      - name: Commit and push
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy ${VERSION} firmware and update flasher"
          git push
